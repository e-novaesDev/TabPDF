<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
  <title>TabPDF</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="bar">
    <button id="open">📂 Abrir PDF</button><input id="file" type="file" accept="application/pdf" hidden>
    <span class="sep"></span>
    <button data-tool="select" class="on">↖ Selecionar</button>
    <button data-tool="text">T Texto</button>
    <button data-tool="field">▭ Campo</button>
    <span class="sep"></span>
    <input id="size" type="number" min="6" max="96" value="14" disabled title="Tamanho da fonte">
    <input id="color" type="color" value="#000000" disabled title="Cor">
    <select id="fmt" disabled title="Formato do campo selecionado (aplicado ao sair do campo)">
      <option value="">Formato: auto</option>
      <option value="num2">Número 0,00</option>
      <option value="brl">Moeda R$</option>
      <option value="pct">Percentual</option>
      <option value="none">Sem formato</option>
    </select>
    <button id="fxb" disabled title="Definir fórmula de cálculo para o campo selecionado">Σ Fórmula</button>
    <button id="del" disabled>🗑 Excluir</button>
    <span class="sep"></span>
    <button id="zout">−</button><span id="zv">130%</span><button id="zin">+</button>
    <span class="sep"></span>
    <button id="save" disabled>⬇ Baixar PDF</button>
    <span id="st" style="font-size:12px;opacity:.75;margin-right:10%;"></span>
    <span style="font-size:12px;opacity:.75;"> <span style="font-size:16px;font-weight:bold;color:#fff;margin-right: 5px;">📄 TabPDF</span> An open-source project made by <a href="https://github.com/e-novaesDev" target="_blank" rel="noopener noreferrer" class="github-profile-link">@e.novaesDev</a></span>
  </div>
  <div id="fx" hidden
    style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--bd)">
    <span>Campo <b id="fxn"></b> =</span><select id="fxo">
      <option value="SUM">Soma</option>
      <option value="AVG">Média</option>
      <option value="MIN">Mínimo</option>
      <option value="MAX">Máximo</option>
      <option value="PRD">Produto</option>
    </select><span>de</span><input id="fxl" style="flex:1;min-width:220px"
      placeholder="campos separados por vírgula"><button id="fxa">Aplicar</button><button
      id="fxr">Remover</button><button id="fxc">✕</button>
  </div>
  <div id="toasts"></div>
  <div id="empty">
    <p><b>Editor de PDF no navegador</b><br>Abra um PDF (ou arraste para cá), escolha <i>Texto</i> ou <i>Campo</i> e
      clique na página. Arraste pela alça ✥ para mover e pelo canto para redimensionar.</p><button id="open2">Abrir
      PDF</button>
  </div>
  <div id="pages"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="js/pdf_engine.js">
  </script>
</body>

</html>
